[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poig-sim"
version = "0.1.0"
description = "Phase 2 economic simulator for AION's Proof of Intelligence Gain (PoIG) reward mechanism"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["poig_sim*"]
