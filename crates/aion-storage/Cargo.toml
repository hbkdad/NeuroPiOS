[package]
name = "aion-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AION content-addressed local storage (docs/PROTOCOL.md model manifest CIDs, Phase 6): real IPFS-compatible CIDv1 generation (cid + multihash crates) and a disk-backed content store with on-read integrity verification"

[dependencies]
cid = { version = "0.11", default-features = false, features = ["std"] }
multihash = "0.19"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
