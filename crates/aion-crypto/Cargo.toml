[package]
name = "aion-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AION identity signing (Ed25519) and commit/reveal helpers (docs/VERIFICATION.md). Reviewed libraries only -- no hand-rolled cryptography, per AGENTS.md."

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
