[package]
name = "aion-p2p"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AION P2P networking: rust-libp2p GossipSub pub/sub, per docs/adr/0002-p2p-stack.md"

[dependencies]
aion-crypto = { path = "../aion-crypto" }
libp2p = { version = "0.53", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "identify", "kad", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
