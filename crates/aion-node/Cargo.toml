[package]
name = "aion-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AION node runtime: hardware auto-detection, composable node roles, and mandatory resource-safety caps (docs/ARCHITECTURE.md)"

[dependencies]
aion-crypto = { path = "../aion-crypto" }
aion-p2p = { path = "../aion-p2p" }
libp2p = { version = "0.56", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "identify", "kad", "macros"] }
sysinfo = "0.30"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
