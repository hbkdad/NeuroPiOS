name: Security audit

# Supply-chain visibility for AION's real dependencies. Milestone 26's
# audit found `cargo audit` reporting 5 known vulnerabilities/unmaintained
# crates, all transitive through libp2p 0.53.2's own dependency tree.
# Milestone 27 upgraded libp2p 0.53 -> 0.56, which cleared 3 of those 5
# (ring, rustls-webpki, instant, lru -- all bumped to fixed versions
# transitively). Two residuals remain, both still genuinely out of this
# project's control: `hickory-proto` (libp2p-mdns pins `^0.25.2`, but the
# fix is >=0.26.1 -- confirmed via `cargo update -p hickory-proto
# --precise 0.26.1` failing with a version-conflict error) and `paste`
# (pinned transitively via `netlink-packet-core`, still unmaintained
# upstream). `continue-on-error: true` stays intentional: both residuals
# are tracked, real, and not fixable by a version bump on our side right
# now -- revisit when a future libp2p release loosens the `hickory-proto`
# constraint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit (Rust dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  pip-audit:
    name: pip-audit (poig_sim dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: simulations/poig_sim
        run: pip install -e ".[dev]" pip-audit
      - working-directory: simulations/poig_sim
        run: pip-audit
